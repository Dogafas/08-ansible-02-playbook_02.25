---
- name: Install Clickhouse
  hosts: clickhouse

  handlers:
    - name: Start clickhouse service
      ansible.builtin.debug:
        msg: "Skipping service start in Docker environment (no systemd)"

  tasks:
    - name: Download ClickHouse packages
      block:
        - name: Get clickhouse distrib
          ansible.builtin.get_url:
            url: "https://packages.clickhouse.com/rpm/stable/{{ item }}-{{ clickhouse_version }}.noarch.rpm"
            dest: "/tmp/{{ item }}-{{ clickhouse_version }}.rpm"
            mode: "0644"
          loop: "{{ clickhouse_packages }}"

      rescue:
        - name: Get clickhouse distrib fallback
          ansible.builtin.get_url:
            url: "https://packages.clickhouse.com/rpm/stable/clickhouse-common-static-{{ clickhouse_version }}.x86_64.rpm"
            dest: "/tmp/clickhouse-common-static-{{ clickhouse_version }}.x86_64.rpm"
            mode: "0644"

    - name: Install clickhouse packages
      ansible.builtin.yum:
        name: "{{ item }}"
      with_fileglob:
        - "/tmp/clickhouse-*.rpm"
      notify: Start clickhouse service

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Create database
      ansible.builtin.debug:
        msg: "Skipping DB creation in Docker environment (ClickHouse server not running)"


# ============================================================
# SECOND PLAY — INSTALL AND CONFIGURE VECTOR
# ============================================================

- name: Install and configure Vector
  hosts: vector

  handlers:
    - name: Restart Vector
      ansible.builtin.debug:
        msg: "Skipping Vector restart in Docker (no systemd)"

  tasks:
    - name: Create Vector directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/vector
        - /opt/vector

    - name: Download Vector archive
      ansible.builtin.get_url:
        url: "https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-x86_64-unknown-linux-gnu.tar.gz"
        dest: "/tmp/vector.tar.gz"
        mode: "0644"

    - name: Unpack Vector
      ansible.builtin.unarchive:
        src: "/tmp/vector.tar.gz"
        dest: "/opt/vector"
        remote_src: true

    - name: Deploy Vector config
      ansible.builtin.template:
        src: templates/vector.yml.j2
        dest: /etc/vector/vector.yml
        owner: root
        group: root
        mode: "0644"
      notify: Restart Vector

    - name: Install systemd unit for Vector
      ansible.builtin.debug:
        msg: "Skipping systemd unit installation in Docker"

    - name: Enable and start Vector
      ansible.builtin.debug:
        msg: "Skipping Vector start in Docker (no systemd)"

