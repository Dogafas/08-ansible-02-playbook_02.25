---
- name: Install ClickHouse
  hosts: clickhouse
  become: true
  vars:
    clickhouse_keyring_path: /usr/share/keyrings/clickhouse-keyring.gpg
    clickhouse_repo_path: /etc/apt/sources.list.d/clickhouse.list

  tasks:
    - name: Install prerequisite packages for ClickHouse repo
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: Download ClickHouse GPG key
      shell: |
        set -e
        curl -fsSL 'https://packages.clickhouse.com/rpm/lts/repodata/repomd.xml.key' \
          | gpg --dearmor -o "{{ clickhouse_keyring_path }}"
        chmod 0644 "{{ clickhouse_keyring_path }}"
      args:
        creates: "{{ clickhouse_keyring_path }}"

    - name: Add ClickHouse APT repository
      copy:
        dest: "{{ clickhouse_repo_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          deb [signed-by={{ clickhouse_keyring_path }} arch=amd64] https://packages.clickhouse.com/deb stable main

    - name: Update APT cache
      apt:
        update_cache: yes

    - name: Install ClickHouse packages
      apt:
        name:
          - clickhouse-server
          - clickhouse-client
        state: present

    - name: Ensure ClickHouse server is running
      service:
        name: clickhouse-server
        state: started
        enabled: true

- name: Install Lighthouse
  hosts: lighthouse
  become: true

  tasks:
    - name: Install nginx and git
      apt:
        name:
          - nginx
          - git
        state: present
        update_cache: yes

    - name: Clone Lighthouse repo
      git:
        repo: https://github.com/VKCOM/lighthouse.git
        dest: /var/www/lighthouse
        version: master

    - name: Configure nginx for Lighthouse
      copy:
        dest: /etc/nginx/sites-available/lighthouse.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen 80;
              server_name _;
              root /var/www/lighthouse;
              index index.html;
          }

    - name: Enable Lighthouse nginx config
      file:
        src: /etc/nginx/sites-available/lighthouse.conf
        dest: /etc/nginx/sites-enabled/lighthouse.conf
        state: link
        force: true

    - name: Remove default nginx config
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Restart nginx
      service:
        name: nginx
        state: restarted
        enabled: true

- name: Install Vector
  hosts: vector
  become: true

  vars:
    vector_version: "0.53.0"
    vector_archive_url: "https://github.com/vectordotdev/vector/releases/download/v0.53.0/vector-0.53.0-x86_64-unknown-linux-gnu.tar.gz"
    vector_archive_path: "/tmp/vector.tar.gz"
    vector_extract_path: "/opt/vector"
    vector_bin_path: "/usr/local/bin/vector"

  tasks:
    - name: Create extraction directory
      file:
        path: "{{ vector_extract_path }}"
        state: directory
        mode: "0755"

    - name: Download Vector archive
      get_url:
        url: "{{ vector_archive_url }}"
        dest: "{{ vector_archive_path }}"
        mode: "0644"

    - name: Extract Vector binary
      unarchive:
        src: "{{ vector_archive_path }}"
        dest: "{{ vector_extract_path }}"
        remote_src: yes
        extra_opts: [--strip-components=2]
        creates: "{{ vector_extract_path }}/bin"

    - name: Move Vector binary to /usr/local/bin
      copy:
        src: "{{ vector_extract_path }}/bin/vector"
        dest: "{{ vector_bin_path }}"
        mode: "0755"
        remote_src: true
      # Убрали 'when', чтобы Ansible всегда проверял наличие файла в /usr/local/bin

    - name: Create Vector systemd unit
      copy:
        dest: /etc/systemd/system/vector.service
        content: |
          [Unit]
          Description=Vector Service
          After=network.target

          [Service]
          ExecStart={{ vector_bin_path }}
          Restart=always
          User=root

          [Install]
          WantedBy=multi-user.target
        mode: "0644"
      notify: Restart vector # Этот обработчик сам сделает daemon-reload

    - name: Enable and start Vector
      systemd:
        name: vector
        state: started
        enabled: true

  handlers:
    - name: Restart vector
      systemd:
        name: vector
        state: restarted
        daemon_reload: yes # Перезагрузит конфиг и сервис одновременно
